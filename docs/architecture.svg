<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AWS Self-Healing IT Help Desk architecture</title>
<desc id="desc">Jenkins tests and builds the Flask application and pushes a Docker image to ECR. Users access an Application Load Balancer that routes to EC2 instances in an Auto Scaling Group. A scheduled CloudWatch Events rule invokes a Lambda function that checks EC2 status and ALB target health and asks the Auto Scaling Group to replace unhealthy instances.</desc>
<defs><style>
.bg{fill:#f5f7fb}.box{fill:#fff;stroke:#bdc9dc;stroke-width:2}.aws{fill:#fff7e8;stroke:#df9b2b;stroke-width:2}.ci{fill:#eef2ff;stroke:#6176df;stroke-width:2}.txt{font:600 17px Arial,sans-serif;fill:#182642}.sub{font:14px Arial,sans-serif;fill:#52617a}.line{fill:none;stroke:#65748b;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#cf7b2a;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#orangeArrow)}.title{font:700 28px Arial,sans-serif;fill:#14213d}.label{font:700 15px Arial,sans-serif;fill:#596982}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65748b"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#cf7b2a"/></marker></defs>
<rect class="bg" width="1200" height="700" rx="20"/>
<text class="title" x="50" y="55">AWS Self-Healing IT Help Desk</text><text class="sub" x="50" y="82">CI pipeline · ECR · health checks · Lambda-driven instance replacement</text>
<rect class="ci" x="50" y="125" width="220" height="100" rx="14"/><text class="txt" x="160" y="160" text-anchor="middle">Developer / GitHub</text><text class="sub" x="160" y="188" text-anchor="middle">Commit and push code</text>
<rect class="ci" x="320" y="125" width="250" height="100" rx="14"/><text class="txt" x="445" y="160" text-anchor="middle">Jenkins CI</text><text class="sub" x="445" y="186" text-anchor="middle">Pytest · SonarQube</text><text class="sub" x="445" y="205" text-anchor="middle">Build and push image</text>
<rect class="aws" x="620" y="125" width="220" height="100" rx="14"/><text class="txt" x="730" y="160" text-anchor="middle">Amazon ECR</text><text class="sub" x="730" y="188" text-anchor="middle">Docker image tags</text>
<path class="line" d="M270 175 H310"/><path class="line" d="M570 175 H610"/>
<rect class="box" x="50" y="330" width="180" height="90" rx="14"/><text class="txt" x="140" y="365" text-anchor="middle">Users</text><text class="sub" x="140" y="390" text-anchor="middle">HTTP request</text>
<rect class="aws" x="280" y="330" width="230" height="90" rx="14"/><text class="txt" x="395" y="365" text-anchor="middle">Application Load Balancer</text><text class="sub" x="395" y="390" text-anchor="middle">HTTP :80</text>
<rect class="aws" x="550" y="300" width="400" height="285" rx="18"/><text class="label" x="575" y="330">Auto Scaling Group</text>
<rect class="box" x="580" y="350" width="155" height="85" rx="12"/><text class="txt" x="657" y="383" text-anchor="middle">EC2 instance</text><text class="sub" x="657" y="408" text-anchor="middle">Docker · Flask :5000</text>
<rect class="box" x="765" y="350" width="155" height="85" rx="12"/><text class="txt" x="842" y="383" text-anchor="middle">Replacement EC2</text><text class="sub" x="842" y="408" text-anchor="middle">Launch template</text>
<rect class="ci" x="585" y="465" width="330" height="85" rx="12"/><text class="txt" x="750" y="495" text-anchor="middle">ALB target health: GET /health</text><text class="sub" x="750" y="520" text-anchor="middle">HTTP 200 expected</text>
<rect class="ci" x="985" y="330" width="175" height="105" rx="14"/><text class="txt" x="1072" y="365" text-anchor="middle">CloudWatch</text><text class="sub" x="1072" y="390" text-anchor="middle">Events schedule</text><text class="sub" x="1072" y="410" text-anchor="middle">Every 5 minutes</text>
<rect class="aws" x="985" y="475" width="175" height="105" rx="14"/><text class="txt" x="1072" y="510" text-anchor="middle">Recovery Lambda</text><text class="sub" x="1072" y="535" text-anchor="middle">Check EC2 + ALB</text><text class="sub" x="1072" y="555" text-anchor="middle">Ask ASG to replace</text>
<path class="line" d="M230 375 H270"/><path class="line" d="M510 375 H540"/><path class="line" d="M730 225 V270 H657 V340"/><path class="line" d="M395 420 V505 H575"/><path class="line" d="M735 393 H755"/><path class="line" d="M1072 435 V465"/><path class="dash" d="M985 525 H960 V430 H930"/><path class="dash" d="M985 550 H970 V605 H750 V560"/><text class="sub" x="600" y="625">Unhealthy instance is terminated; ASG restores desired capacity</text>
<text class="sub" x="50" y="665">Demo scope: instance-level recovery. Ticket records remain in memory.</text>
