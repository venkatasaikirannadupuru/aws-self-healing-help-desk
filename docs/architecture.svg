<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AWS Self-Healing IT Help Desk architecture</title>
<desc id="desc">Jenkins builds and tests the Flask application and pushes its Docker image to ECR. Users reach an Application Load Balancer, which forwards traffic to EC2 instances in an Auto Scaling Group. Target group health checks detect unhealthy instances and the Auto Scaling Group replaces them.</desc>
<defs><style>
.bg{fill:#f5f7fb}.box{fill:#fff;stroke:#bdc9dc;stroke-width:2}.aws{fill:#fff7e8;stroke:#df9b2b;stroke-width:2}.ci{fill:#eef2ff;stroke:#6176df;stroke-width:2}.txt{font:600 17px Arial,sans-serif;fill:#182642}.sub{font:14px Arial,sans-serif;fill:#52617a}.line{fill:none;stroke:#65748b;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#cf7b2a;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#orangeArrow)}.title{font:700 28px Arial,sans-serif;fill:#14213d}.label{font:700 15px Arial,sans-serif;fill:#596982}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65748b"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#cf7b2a"/></marker></defs>
<rect class="bg" width="1200" height="700" rx="20"/>
<text class="title" x="50" y="55">AWS Self-Healing IT Help Desk</text><text class="sub" x="50" y="82">CI pipeline · container registry · health checks · instance replacement</text>
<rect class="ci" x="50" y="125" width="250" height="110" rx="14"/><text class="txt" x="175" y="160" text-anchor="middle">Developer / GitHub</text><text class="sub" x="175" y="188" text-anchor="middle">Commit and push code</text>
<rect class="ci" x="360" y="125" width="250" height="110" rx="14"/><text class="txt" x="485" y="160" text-anchor="middle">Jenkins CI</text><text class="sub" x="485" y="186" text-anchor="middle">Pytest · SonarQube</text><text class="sub" x="485" y="207" text-anchor="middle">Docker build and push</text>
<rect class="aws" x="680" y="125" width="220" height="110" rx="14"/><text class="txt" x="790" y="160" text-anchor="middle">Amazon ECR</text><text class="sub" x="790" y="188" text-anchor="middle">Versioned container image</text>
<path class="line" d="M300 180 H350"/><path class="line" d="M610 180 H670"/>
<rect class="box" x="50" y="320" width="200" height="95" rx="14"/><text class="txt" x="150" y="355" text-anchor="middle">Users</text><text class="sub" x="150" y="382" text-anchor="middle">HTTP request</text>
<rect class="aws" x="320" y="320" width="240" height="95" rx="14"/><text class="txt" x="440" y="355" text-anchor="middle">Application Load Balancer</text><text class="sub" x="440" y="382" text-anchor="middle">Routes traffic on port 80</text>
<rect class="aws" x="650" y="300" width="470" height="285" rx="18"/><text class="label" x="675" y="330">EC2 Auto Scaling Group · two public subnets</text>
<rect class="box" x="685" y="360" width="190" height="90" rx="12"/><text class="txt" x="780" y="393" text-anchor="middle">EC2 instance A</text><text class="sub" x="780" y="419" text-anchor="middle">Docker · Flask :5000</text>
<rect class="box" x="900" y="360" width="190" height="90" rx="12"/><text class="txt" x="995" y="393" text-anchor="middle">EC2 instance B</text><text class="sub" x="995" y="419" text-anchor="middle">Replacement capacity</text>
<rect class="ci" x="730" y="480" width="340" height="75" rx="12"/><text class="txt" x="900" y="510" text-anchor="middle">Target group health checks</text><text class="sub" x="900" y="535" text-anchor="middle">GET /health · expect HTTP 200</text>
<path class="line" d="M250 367 H310"/><path class="line" d="M560 367 H640"/><path class="line" d="M790 235 V270 H780 V350"/><path class="line" d="M440 415 V520 H720"/><path class="line" d="M875 405 H890"/><path class="dash" d="M900 480 V462 H995 V460"/><text class="sub" x="935" y="607" text-anchor="middle">Unhealthy instance → ASG replaces capacity</text>
<text class="sub" x="50" y="660">Demo scope: instance-level recovery. Ticket storage is in memory until a database is added.</text>
</svg>